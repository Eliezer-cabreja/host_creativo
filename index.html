<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creativos Rp</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Orbitron',sans-serif;
            height:100vh;display:flex;align-items:center;justify-content:center;
            background:url('imagen/images.png') center/cover no-repeat;
            position:relative;
        }
        body::before{
            content:'';position:absolute;inset:0;
            background:rgba(0,0,0,.7);z-index:0;
        }
        .login-card{
            position:relative;z-index:1;
            background:rgba(20,20,30,.9);backdrop-filter:blur(8px);
            border:1px solid rgba(255,20,147,.5);
            border-radius:20px;
            padding:30px 45px 25px;
            width:100%;max-width:520px;
            box-shadow:0 20px 60px rgba(0,0,0,.9),0 0 40px rgba(255,20,147,.3);
            transition:.3s;
        }
        .login-card:hover{
            transform:scale(1.02);
            border-color:#ff1493;
            box-shadow:0 0 60px rgba(255,20,147,.5);
        }
        .logo{text-align:center;margin-bottom:18px}
        .logo-img{
            width:80px;
            height:auto;
            display:block;
            margin:0 auto 6px;
            filter:drop-shadow(0 0 20px #ff1493);
        }
        .logo h1{
            font-weight:900;font-size:22px;letter-spacing:2px;
            background:linear-gradient(135deg,#ff69b4,#ff1493);
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;
        }
        .logo p{color:#b0b0c0;font-size:10px;letter-spacing:2px;margin-top:4px}
        .form-group{margin-bottom:14px}
        .form-group label{display:block;color:#e0e0f0;font-size:11px;font-weight:700;letter-spacing:1px;margin-bottom:5px;text-transform:uppercase}
        .form-group input{
            width:100%;padding:12px 16px;
            background:rgba(255,255,255,.05);
            border:1px solid rgba(255,255,255,.1);
            border-radius:10px;color:#fff;
            font-family:'Orbitron',sans-serif;font-size:13px;outline:none;
            transition:.3s;
        }
        .form-group input:focus{
            border-color:#ff1493;
            box-shadow:0 0 20px rgba(255,20,147,.3);
            background:rgba(255,255,255,.08);
        }
        .form-group input::placeholder{color:#6a6a80;font-weight:300}
        .btn-login{
            width:100%;padding:14px;
            background:linear-gradient(135deg,#ff69b4,#ff1493);
            border:none;border-radius:10px;
            color:#0b0e1a;font-family:'Orbitron',sans-serif;font-weight:900;font-size:15px;letter-spacing:2px;
            cursor:pointer;transition:.3s;
            box-shadow:0 8px 24px rgba(255,20,147,.4);
            margin-top:6px;
        }
        .btn-login:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(255,20,147,.6)}
        .btn-login:active{transform:translateY(0)}
        #loginMessage{margin-top:12px;text-align:center;font-size:11px;min-height:18px;letter-spacing:1px}
        .footer{text-align:center;margin-top:18px;color:#6a6a80;font-size:9px;letter-spacing:1px}
        .footer a{color:#ff69b4;text-decoration:none;transition:.3s}
        .footer a:hover{color:#ff1493}
        @media(max-width:480px){.login-card{padding:20px 20px;margin:0 10px}.logo h1{font-size:18px}}
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <img src="imagen/logo.png" alt="Logo del servidor" class="logo-img">
            <h1>Creativo Rp</h1>
            <p>PANEL DE ADMINISTRACIÓN</p>
        </div>
        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label>Usuario</label>
                <input type="text" id="username" placeholder="Ingresa tu usuario" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">ACCEDER</button>
        </form>
        <div id="loginMessage"></div>
        <div class="footer"><span>¿Problemas? <a href="#">Contacta a un superior</a></span></div>
    </div>
    <script>
        (() => {
            const form = document.getElementById('loginForm');
            const messageEl = document.getElementById('loginMessage');
            const loginBtn = document.getElementById('loginBtn');

            // 🔹 CAMBIA ESTA URL POR LA DE TU API
            const API_URL = 'http://161.97.133.24:8019/api/login';

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value.trim();

                if (!username || !password) {
                    return showMessage('Completa todos los campos.', 'error');
                }

                // Deshabilitar botón mientras se procesa
                loginBtn.disabled = true;
                loginBtn.textContent = 'VERIFICANDO...';
                showMessage('', '');

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ username, password })
                    });

                    const data = await response.json();

                    if (data.success) {
                        showMessage('✅ ' + (data.message || 'Inicio exitoso'), 'success');
                        // Guardar token si existe
                        if (data.token) {
                            localStorage.setItem('authToken', data.token);
                        }
                        // Redirigir al panel después de 1.5 segundos
                        setTimeout(() => {
                            window.location.href = 'dashboard.html';
                        }, 1500);
                    } else {
                        showMessage('❌ ' + (data.message || 'Credenciales incorrectas'), 'error');
                        loginBtn.disabled = false;
                        loginBtn.textContent = 'ACCEDER';
                    }
                } catch (error) {
                    console.error('Error de conexión:', error);
                    showMessage('❌ Error de conexión con el servidor.', 'error');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'ACCEDER';
                }
            });

            function showMessage(msg, type) {
                messageEl.textContent = msg;
                messageEl.style.color = type === 'success' ? '#ff69b4' : (type === 'error' ? '#ff6b6b' : '');
                messageEl.style.opacity = 0;
                setTimeout(() => {
                    messageEl.style.opacity = 1;
                    messageEl.style.transition = 'opacity .4s';
                }, 50);
            }

            // Limpiar mensaje al escribir
            ['username', 'password'].forEach(id => {
                document.getElementById(id).addEventListener('input', () => {
                    messageEl.textContent = '';
                    // Si el botón estaba deshabilitado por error, lo reactivamos
                    if (loginBtn.disabled) {
                        loginBtn.disabled = false;
                        loginBtn.textContent = 'ACCEDER';
                    }
                });
            });
        })();
    </script>
</body>
</html>
